name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project "Hidden Bar.xcodeproj" -scheme "Hidden Bar"

      - name: Build
        run: |
          xcodebuild -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            build

      - name: Create zip
        run: |
          cd "build/DerivedData/Build/Products/Release"
          zip -r "$GITHUB_WORKSPACE/HiddenBar.zip" "Hidden Bar.app"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: HiddenBar.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cask SHA256
        run: |
          SHA256=$(shasum -a 256 HiddenBar.zip | awk '{print $1}')
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/hidden-bar.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/hidden-bar.rb

      - name: Commit Cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git add Casks/hidden-bar.rb
          git commit -m "chore: update cask sha256 for ${GITHUB_REF#refs/tags/}" || true
          git push origin develop || true
